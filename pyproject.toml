[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fnpackkit"
version = "0.1.0"
description = "Native fnOS packaging and shared application runtime boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["buildflow[images] @ git+https://github.com/user-no-found/BuildFlow.git@main"]

[project.scripts]
fnpackkit = "fnpackkit.cli:main"
